---
layout: default
---

<article class="work-detail">
    <header class="work-hero">
        {% if page.featured_image %}
        <div class="work-hero-media">
            <img src="{{ page.featured_image | relative_url }}" alt="{{ page.title }}">
        </div>
        {% endif %}

        <p class="work-hero-meta">
            <span class="work-year">{{ page.year }}</span>
            <span class="work-sep">·</span>
            <span class="work-category">{{ page.category | default: "Multimedia" }}</span>
        </p>

        <div class="work-hero-head">
            <h1 class="work-title">{{ page.title }}</h1>
            {% if page.subtitle %}
            <p class="work-subtitle">{{ page.subtitle }}</p>
            {% endif %}
        </div>
    </header>

    <div class="work-content">
        {{ content }}
    </div>
</article>
