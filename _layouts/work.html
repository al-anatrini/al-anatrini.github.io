---
layout: default
---

<article class="work-detail">
    <header class="work-header">
        <div class="work-header-content">
            <div class="work-meta">
                <span class="work-year">{{ page.year }}</span>
                <span class="work-category">{{ page.category | default: "Multimedia" }}</span>
            </div>
            <h1 class="work-title">{{ page.title }}</h1>
            {% if page.subtitle %}
            <p class="work-subtitle">{{ page.subtitle }}</p>
            {% endif %}
        </div>
    </header>

    <div class="work-content">
        {{ content }}
    </div>
</article>
