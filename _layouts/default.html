<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: 'Composer, computational artist, and researcher developing adaptive multimedia systems that blur boundaries between past and present' }}">

    <!-- SEO Meta Tags -->
    <meta name="author" content="Alessandro Anatrini">
    <meta name="keywords" content="computational art, multimedia composition, interactive installation, generative art, worldbuilding, adaptive systems">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: 'Composer & computational artist developing adaptive multimedia systems' }}">
    <meta property="og:image" content="{{ page.featured_image | default: '/assets/images/backgrounds/home-bg.jpg' | absolute_url }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: 'Composer & computational artist' }}">
    <meta name="twitter:image" content="{{ page.featured_image | default: '/assets/images/backgrounds/home-bg.jpg' | absolute_url }}">

    <!-- Favicon - Baroque ornament in brand colors -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicons/favicon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicons/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicons/favicon-16x16.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicons/apple-touch-icon.png' | relative_url }}">

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}">
    <!-- Skip to content for accessibility -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div class="grain-overlay"></div>

    {% unless page.url == '/' %}
    <!-- Geometric diamond - links back home -->
    <a href="{{ '/' | relative_url }}" class="home-button" aria-label="Return to home">
        <span class="baroque-ornament">
            <div class="geometric-diamond"></div>
        </span>
    </a>
    {% endunless %}

    <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-overlay">
                <span class="nav-toggle-glyph" aria-hidden="true">+</span>
            </button>
        </div>
    </nav>

    <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
        <nav class="nav-overlay-nav" aria-label="Sections">
            <ul class="nav-overlay-links">
                <li><a href="{{ '/works' | relative_url }}" class="nav-overlay-link {% if page.url contains '/work' %}is-active{% endif %}">Works</a></li>
                <li><a href="{{ '/bio' | relative_url }}" class="nav-overlay-link {% if page.url == '/bio/' %}is-active{% endif %}">Bio</a></li>
                <li><a href="{{ '/research' | relative_url }}" class="nav-overlay-link {% if page.url == '/research/' %}is-active{% endif %}">Research</a></li>
                <li><a href="{{ '/contact' | relative_url }}" class="nav-overlay-link {% if page.url == '/contact/' %}is-active{% endif %}">Contact</a></li>
            </ul>
        </nav>
    </div>

    <main class="main-content" id="main-content">
        {{ content }}
    </main>

    <footer class="main-footer" role="contentinfo">
        <div class="footer-content">
            <div class="footer-ornament">◆</div>

            <div class="footer-info">
                <p class="footer-name">Alessandro Anatrini</p>
                <p class="footer-tagline">Composer & Computational Artist</p>
            </div>

            <div class="footer-links">
                <a href="mailto:alessandro@anatrini.com" class="footer-link">
                    <span class="footer-link-label">Email</span>
                </a>
                <a href="https://github.com/anatrini" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <span class="footer-link-label">GitHub</span>
                </a>
                <a href="https://www.linkedin.com/in/alessandro-anatrini/" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <span class="footer-link-label">LinkedIn</span>
                </a>
                <a href="https://vimeo.com/user147203365" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <span class="footer-link-label">Vimeo</span>
                </a>
                <a href="https://instagram.com/anatrini_" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <span class="footer-link-label">Instagram</span>
                </a>
            </div>

            <div class="footer-bottom">
                <p class="footer-copyright">&copy; {{ 'now' | date: "%Y" }} Alessandro Anatrini. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Back to top button -->
    <button class="back-to-top" aria-label="Back to top"></button>

    <div class="cursor-follower"></div>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
